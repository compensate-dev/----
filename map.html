<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#d9d2c1"><meta name="description" content="全屏沉浸式纸片 3D 水墨云游：云海之上，金陵宫阙、钟山林泉、洪州城郭、采石矶崖、一叶江舟、汴京小楼、北邙松柏。拖拽旋转，朱砂点为引，飞往李煜人生的每一站。"><title>水墨行迹｜春水留痕·李煜词境</title><link rel="stylesheet" href="style.css?v=f12"><script src="script.js?v=f12" defer></script></head>
<body class="map-page map-full">
  <!-- 无障碍：跳转主内容 -->
  <a class="skip-link" href="#main-content">跳至主要内容</a>

  <!-- 全屏 3D 舞台 -->
  <div class="stage3d" id="stage3d" aria-label="纸片式水墨山水三维场景，可拖拽旋转、滚轮缩放">
    <nav class="dot-nav" aria-label="云游站点">
      <button class="dot-btn" type="button" data-go="jinling" aria-label="飞往金陵：南唐都城"><span class="dot-tip">金陵 · 都城</span></button>
      <button class="dot-btn" type="button" data-go="zhongshan" aria-label="飞往钟山：少年隐读"><span class="dot-tip">钟山 · 少隐</span></button>
      <button class="dot-btn" type="button" data-go="hongzhou" aria-label="飞往洪州：南唐南都"><span class="dot-tip">洪州 · 南都</span></button>
      <button class="dot-btn" type="button" data-go="caishi" aria-label="飞往采石矶：江防要冲"><span class="dot-tip">采石矶 · 江防</span></button>
      <button class="dot-btn" type="button" data-go="jiangzhou" aria-label="飞往江舟：辞庙北上"><span class="dot-tip">江舟 · 北迁</span></button>
      <button class="dot-btn" type="button" data-go="bianjing" aria-label="飞往汴京：违命侯岁月"><span class="dot-tip">汴京 · 囚居</span></button>
      <button class="dot-btn" type="button" data-go="beimang" aria-label="飞往北邙山：长眠之所"><span class="dot-tip">北邙山 · 归处</span></button>
      <button class="dot-btn dot-btn-overview" type="button" data-go="overview" aria-label="回到全景"><span class="dot-tip">全景 · 疆域</span></button>
    </nav>

    <aside class="map-panel ink-popup" id="inkPopup" aria-live="polite">
      <button class="popup-close" type="button" aria-label="收起笺卡">×</button>
      <div class="map-panel-empty" data-popup-default>
        <span class="map-panel-seal" aria-hidden="true">迹</span>
        <h3>点选右侧朱砂圆点</h3>
        <p>八个点位，一段四十一年的旅程：<br>镜头飞往何处，笺纸上便展开何处的人事——<br>与一句至今仍在流转的词。</p>
      </div>
      <article class="map-detail" data-popup-detail hidden>
        <header><span class="map-detail-tag" data-spot-era></span><h3 data-spot-name></h3><small data-spot-now></small></header>
        <ul class="map-events" data-spot-events></ul>
        <div class="map-word"><span>代表词句</span><p data-spot-word></p></div>
      </article>
    </aside>

    <span class="stage-hint" id="stageHint">拖拽旋转 · 滚轮缩放 · 右键平移</span>
    <p class="map-footnote">纸片式三维水墨写意 · 山川城邑不作历史地理考据<br>所配词作为与该站词心相映的代表之作</p>
  </div>

  <!-- 顶部浮层：品牌 + 返回 + 音乐 -->
  <div class="map-topbar">
    <span class="brand"><span class="brand-seal">煜</span><span class="map-title">水墨行迹<small>春水留痕 · 李煜词境</small></span></span>
    <a class="map-back" href="index.html">⟵ 返回词境</a>
    <button class="map-sound sound-toggle" type="button" aria-label="关闭背景音乐" aria-pressed="true"><span class="sound-icon">♫</span></button>
  </div>

  <!-- 入卷遮罩 -->
  <div class="map-veil" id="mapVeil" aria-hidden="true">
    <div class="veil-inner"><span class="brand-seal veil-seal">煜</span><p>水墨行迹</p><small>铺纸 · 研墨 · 起笔</small></div>
  </div>

  <!-- 背景音乐（与全站同款） -->
  <audio class="background-audio" src="background-music.mp3" autoplay loop preload="metadata"></audio>
  <!-- Three.js 本地库 -->
  <script src="three.min.js"></script>
  <!-- 内嵌纹理表：WebP dataURI 集，缺省时回退同名图片文件 -->
  <script src="map-textures.js?v=f12"></script>
  <script>
  (function () {
    "use strict";
    if (typeof THREE === "undefined") return;
    // 尊重系统「减弱动效」设置
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var INK = function (a) { return "rgba(46,46,42," + a + ")"; };

    /* ---------- 程序化水墨贴图（云影 / 月 / 雁 / 水纹） ---------- */
    function cnv(w, h) { var c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
    function toTex(c) { var t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t; }
    function blobTex() {
      var c = cnv(128, 128), x = c.getContext("2d");
      var g = x.createRadialGradient(64, 64, 4, 64, 64, 62);
      g.addColorStop(0, "rgba(60,60,54,0.4)"); g.addColorStop(1, "rgba(60,60,54,0)");
      x.fillStyle = g; x.fillRect(0, 0, 128, 128);
      return c;
    }
    function moonTex() {
      var c = cnv(128, 128), x = c.getContext("2d");
      x.beginPath(); x.arc(64, 64, 34, 0, 6.283);
      x.fillStyle = "rgba(233,227,203,0.5)"; x.fill();
      x.strokeStyle = "rgba(140,134,112,0.5)"; x.lineWidth = 2; x.stroke();
      return c;
    }
    function birdsTex() {
      var c = cnv(128, 64), x = c.getContext("2d");
      x.strokeStyle = INK(0.5); x.lineWidth = 2; x.lineCap = "round";
      [[20, 18], [56, 10], [92, 24]].forEach(function (p) {
        x.beginPath(); x.moveTo(p[0] - 7, p[1] + 4); x.quadraticCurveTo(p[0], p[1] - 4, p[0] + 7, p[1] + 4); x.stroke();
      });
      return c;
    }
    function rippleTex() {
      var c = cnv(512, 256), x = c.getContext("2d");
      x.strokeStyle = INK(0.38); x.lineWidth = 1.6; x.lineCap = "round";
      for (var row = 0; row < 7; row++) {
        var y = 24 + row * 34;
        for (var seg = 0; seg < 5; seg++) {
          var sx = ((row * 97 + seg * 123) % 512);
          [sx - 512, sx, sx + 512].forEach(function (bx) {
            x.beginPath(); x.moveTo(bx, y); x.quadraticCurveTo(bx + 16, y - 7, bx + 34, y); x.stroke();
          });
        }
      }
      return c;
    }

    /* ---------- 场景 ---------- */
    // 场景 / 相机 / 渲染器初始化（雾色同云海底色）
    var stage = document.getElementById("stage3d");
    if (!stage) return;
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd9d2c1);
    scene.fog = new THREE.Fog(0xd9d2c1, 30, 135);
    var camera = new THREE.PerspectiveCamera(46, 1, 0.1, 420);
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    stage.appendChild(renderer.domElement);
    // 视口自适应
    function resize() {
      var w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);

    /* 已抠图素材（真水墨）+ 程序化贴图（补缺） */
    // 加载管理：真素材全部就绪后揭去入卷遮罩（超时 3.2s 兜底）
    var manager = new THREE.LoadingManager();
    var imgLoader = new THREE.TextureLoader(manager);
    imgLoader.crossOrigin = null; // 关键：去掉 CORS 模式，file:// 双击直开也能加载图片
    var veilDone = false;
    function hideVeil() {
      if (veilDone) return; veilDone = true;
      var veil = document.getElementById("mapVeil");
      if (veil) veil.classList.add("is-hidden");
    }
    manager.onLoad = hideVeil;
    window.setTimeout(hideVeil, 3200);

    // 内嵌纹理（map-textures.js 里的 WebP dataURI）：data: 不受跨域限制，file:// 双击直开也能进 WebGL
    var EMB = window.MAP_TEXTURES || {};
    function srcOf(n) { return EMB[n] || n; }
    // 真抠图素材：云 / 远山 / 水岸 / 孤舟 / 柳 / 芦苇
    var cloudTex = imgLoader.load(srcOf("hero-mist-cloud.png"));
    var texFar = imgLoader.load(srcOf("parallax-far.png"));
    var texShore = imgLoader.load(srcOf("parallax-shore.png"));
    var texBoat = imgLoader.load(srcOf("parallax-boat-v2.png"));
    var texWillow = imgLoader.load(srcOf("parallax-willow.png"));
    var texReed = imgLoader.load(srcOf("parallax-reed.png"));
    // 山峦/汀州素材：已离线预抠图（*-a.png 带透明通道），file:// 与 http:// 渲染完全一致
    var inkTex = {};
    ["mtn-sharp-focal.png", "mtn-peak-dense.png", "mtn-dome-dark.png", "mtn-range-mist.png", "mtn-triple.png", "mtn-dome-ochre.png", "mtn-far-faint.png", "mtn-bg-mist.png", "isle-front.jpg", "isle-mid.jpg", "isle-far.jpg", "palace.jpg", "citywall.jpg", "tower.jpg", "cliff.jpg", "pine-1.jpg", "pine-2.jpg", "pine-3.jpg"].forEach(function (u) {
      inkTex[u] = imgLoader.load(srcOf(u.replace(/\.(png|jpg)$/, "-a.png")));
    });
    var inkList = Object.keys(inkTex).map(function (k) { return inkTex[k]; });

    // 云海大地（水面：极淡波纹 + 半透明，承载倒影）
    var seaCnv = cnv(512, 256);
    seaCnv.getContext("2d").globalAlpha = 0.3;
    seaCnv.getContext("2d").drawImage(rippleTex(), 0, 0, seaCnv.width, seaCnv.height);
    var seaTex = toTex(seaCnv);
    seaTex.wrapS = seaTex.wrapT = THREE.RepeatWrapping; seaTex.repeat.set(10, 4);
    var seaGeo = new THREE.PlaneGeometry(460, 460);
    var sea = new THREE.Mesh(seaGeo, new THREE.MeshBasicMaterial({ map: seaTex, color: 0xe7e1d0, transparent: true, opacity: 0.92, depthWrite: false }));
    sea.rotation.x = -Math.PI / 2; scene.add(sea);

    // 面片：真素材按原始宽高比立起
    var upright = [];
    function imagePlane(tex, w, x, z, opts) {
      opts = opts || {};
      var mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false, opacity: opts.opacity || 1 });
      // 光影：光自西北来，东侧山体/汀州稍暗（静态烘焙受光差）
      var lb = 1 - 0.06 * THREE.MathUtils.clamp((x + 70) / 140, 0, 1);
      if (inkList.indexOf(tex) >= 0) mat.color.setScalar(lb);
      var mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
      function fit() {
        var img = tex.image;
        var asp = img && img.height ? img.height / img.width : 0.3;
        mesh.scale.set(w, w * asp * (opts.stretch || 1), 1);
        mesh.position.set(x, (opts.y || 0) + mesh.scale.y / 2, z);
        mesh.userData.baseY = mesh.position.y;
      }
      if (opts.ry) mesh.rotation.y = opts.ry;
      scene.add(mesh); upright.push({ mesh: mesh, fit: fit, tex: tex });
      // 纸背厚度（水墨拆片为透明底，无纸边，不带纸背）
      if (inkList.indexOf(tex) < 0) {
        var back = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false, color: 0x8b8b84, opacity: 0.5 }));
        function fitBack() { back.scale.copy(mesh.scale); back.position.set(x, mesh.position.y, z - 0.24); back.rotation.y = opts.ry || 0; }
        scene.add(back); upright.push({ mesh: back, fit: fitBack, tex: tex });
      }
      // 水面倒影：垂直镜像 + 低透明度 + 水色混合（模糊在 onLoad 统一处理）
      if (opts.reflect) {
        var refl = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false, opacity: 0.1, color: 0xd4cdb8 }));
        refl.userData.isRefl = true;
        function fitRefl() {
          refl.scale.set(mesh.scale.x, -mesh.scale.y, 1);
          refl.position.set(x, (opts.y || 0) - mesh.scale.y / 2 + 0.05, z);
          refl.rotation.y = opts.ry || 0;
        }
        scene.add(refl); upright.push({ mesh: refl, fit: fitRefl, tex: tex });
      }
      if (tex.image && tex.image.width) fit(); else tex.addEventListener("load", fit);
      return mesh;
    }
    // 轻模糊纹理：用于水面倒影（canvas filter blur；file:// 下先探测画布可用性）
    function blurredTex(tex, r) {
      var img = tex.image; if (!img || !img.width) return tex;
      var c = cnv(img.width, img.height), x = c.getContext("2d");
      x.filter = "blur(" + r + "px)"; x.drawImage(img, 0, 0); x.filter = "none";
      var t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
    }
    function canvasUsable(img) {
      try {
        var t = document.createElement("canvas"); t.width = t.height = 2;
        var g = t.getContext("2d"); g.drawImage(img, 0, 0, 2, 2); g.getImageData(0, 0, 1, 1);
        return true;
      } catch (e) { return false; }
    }
    // 素材全部就绪：倒影轻模糊、面片按原图比例立起、揭开遮罩
    manager.onLoad = function () {
      upright.forEach(function (u) {
        if (u.mesh.userData && u.mesh.userData.isRefl && u.mesh.material.map.image && canvasUsable(u.mesh.material.map.image)) {
          u.mesh.material.map = blurredTex(u.mesh.material.map, 3);
        }
        u.fit();
      });
      hideVeil();
      console.log("[水墨行迹] build f12 · 内嵌纹理直载");
    };
    // 水面墨点投影：给落点垫一团淡影
    function shadowBlob(x, z, s) {
      var m = new THREE.Mesh(new THREE.PlaneGeometry(s, s * 0.36), new THREE.MeshBasicMaterial({ map: toTex(blobTex()), transparent: true, opacity: 0.45, depthWrite: false }));
      m.rotation.x = -Math.PI / 2; m.position.set(x, 0.03, z); scene.add(m);
    }

    /* ---------- 七处景致（山峦用真抠图素材） ---------- */
    // 远山底幕：远景层与留白层交替环绕，底边沉入云海
    imagePlane(inkTex["mtn-far-faint.png"], 66, -34, -58, { y: -11 });
    imagePlane(inkTex["mtn-bg-mist.png"], 70, 12, -64, { y: -12, ry: 0.12, opacity: 0.9 });
    imagePlane(inkTex["mtn-far-faint.png"], 62, 46, -30, { y: -10, ry: 0.5, opacity: 0.85 });
    imagePlane(inkTex["mtn-bg-mist.png"], 66, -62, 26, { y: -11, ry: -0.5, opacity: 0.9 });
    imagePlane(inkTex["mtn-far-faint.png"], 64, 34, 52, { y: -10, ry: -0.3, opacity: 0.85 });
    imagePlane(inkTex["mtn-bg-mist.png"], 68, -30, 54, { y: -12, ry: -0.7, opacity: 0.9 });
    // 最外侧天际留白大幕
    imagePlane(inkTex["mtn-bg-mist.png"], 130, -8, -92, { y: -30, opacity: 0.75 });
    imagePlane(inkTex["mtn-bg-mist.png"], 110, 66, -66, { y: -26, ry: 0.5, opacity: 0.7 });
    // 1·2 主峰拆片群（金陵·钟山共享）：六片由近及远叠出纵深
    shadowBlob(-30, -14, 18);
    shadowBlob(-12, -40, 15);
    // 宫阙（金陵·都城）：真素材 + 十字交叉面片
    imagePlane(inkTex["palace.jpg"], 15, -30, -14, null);
    // 松柏（钟山林泉）：真素材单株 + 十字交叉面片
    imagePlane(inkTex["pine-2.jpg"], 4.5, -8, -22, null);
    imagePlane(inkTex["isle-front.jpg"], 30, -44, -22, { y: -5.3, ry: 0.3, opacity: 0.95 });
    imagePlane(inkTex["isle-mid.jpg"], 22, 6, -34, { y: -3.8, ry: -0.2, opacity: 0.85 });
    imagePlane(inkTex["mtn-dome-dark.png"], 36, 0, -17, { ry: 0.12, stretch: 0.6 });
    imagePlane(inkTex["mtn-peak-dense.png"], 52, -26, -30, { reflect: true });
    imagePlane(inkTex["mtn-sharp-focal.png"], 46, -4, -34, { reflect: true });
    imagePlane(inkTex["mtn-triple.png"], 38, 14, -42, { ry: -0.2, opacity: 0.95 });
    imagePlane(inkTex["mtn-range-mist.png"], 60, -22, -46, { opacity: 0.85 });
    imagePlane(inkTex["mtn-dome-ochre.png"], 40, -44, -50, { ry: 0.25, opacity: 0.8 });
    // 3 洪州：城郭 + 岸山
    shadowBlob(-46, 20, 16);
    // 城郭（洪州·南都）：真素材 + 十字交叉面片
    imagePlane(inkTex["citywall.jpg"], 16, -46, 20, null);
    imagePlane(inkTex["isle-front.jpg"], 32, -46, 32, { y: -5.7, opacity: 0.95 });
    imagePlane(texFar, 40, -52, 40, { ry: -0.4, opacity: 0.85 });
    // 4 采石矶：陡崖 + 浓墨辅助山
    shadowBlob(20, -8, 10);
    // 江防要塞（采石矶）：真素材 + 十字交叉面片，横向构图加宽落位
    imagePlane(inkTex["cliff.jpg"], 13, 20, -8, { ry: -0.25 });
    imagePlane(texFar, 30, 38, -30, { ry: -0.25, opacity: 0.85 });
    imagePlane(inkTex["isle-far.jpg"], 34, 30, -20, { y: -4.7, ry: -0.25, opacity: 0.9 });
    // 5 江舟：孤舟（主峰群在望）
    var boat = imagePlane(texBoat, 4.6, 34, 1, { y: 0.06 });
    imagePlane(inkTex["isle-mid.jpg"], 26, 40, -24, { y: -4.5, opacity: 0.9 });
    imagePlane(inkTex["isle-front.jpg"], 24, 44, 20, { y: -4.3, ry: -0.2, opacity: 0.9 });
    imagePlane(texFar, 40, 30, -34, { opacity: 0.9 });
    // 6 汴京：小楼庭院（周围大片留白）
    shadowBlob(-58, -46, 7);
    // 囚居小院（汴京·违命侯）：真素材 + 十字交叉面片
    imagePlane(inkTex["tower.jpg"], 5, -58, -46, null);
    imagePlane(texFar, 34, -60, -62, { opacity: 0.8 });
    // 7 北邙山：赭石圆顶丘陵 + 松柏（倒影）
    shadowBlob(50, 40, 13);
    imagePlane(inkTex["mtn-dome-ochre.png"], 38, 50, 44, { stretch: 0.75, reflect: true });
    imagePlane(texShore, 24, 38, 34, { ry: 0.3, stretch: 0.7, opacity: 0.85 });
    // 北邙松柏：苍虬老松 + 虬曲松 环侍圆丘（真素材 + 十字交叉面片）
    imagePlane(inkTex["pine-3.jpg"], 5.5, 50, 36, null);
    imagePlane(inkTex["pine-1.jpg"], 4, 41, 40, null);
    // 岸芷汀兰：柳与芦苇（真素材）
    imagePlane(texWillow, 7, 24, 8, { ry: 0.4 });
    imagePlane(texWillow, 6, -20, 10, { ry: -0.5 });
    imagePlane(texReed, 5, 8, 9, { opacity: 0.9 });
    imagePlane(texReed, 4.5, -64, 6, { ry: 0.3 });
    imagePlane(texReed, 4.5, 58, -4, { ry: -0.3 });
    // 月与雁
    var moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: toTex(moonTex()), transparent: true, opacity: 0.75, depthWrite: false }));
    moon.scale.set(9, 9, 1); moon.position.set(-26, 26, -52); scene.add(moon);
    var birds = new THREE.Sprite(new THREE.SpriteMaterial({ map: toTex(birdsTex()), transparent: true, opacity: 0.6, depthWrite: false }));
    birds.scale.set(5, 2.5, 1); birds.position.set(12, 18, -20); scene.add(birds);

    // 江面波纹（云海之间的水面暗示）
    var waterTexA = toTex(rippleTex());
    waterTexA.wrapS = waterTexA.wrapT = THREE.RepeatWrapping; waterTexA.repeat.set(5, 1);
    var waterTexB = toTex(rippleTex());
    waterTexB.wrapS = waterTexB.wrapT = THREE.RepeatWrapping; waterTexB.repeat.set(3, 1);
    var waterA = new THREE.Mesh(new THREE.PlaneGeometry(150, 14), new THREE.MeshBasicMaterial({ map: waterTexA, transparent: true, opacity: 0.4, depthWrite: false }));
    waterA.rotation.x = -Math.PI / 2; waterA.position.set(6, 0.06, 0); scene.add(waterA);
    var waterB = new THREE.Mesh(new THREE.PlaneGeometry(110, 18), new THREE.MeshBasicMaterial({ map: waterTexB, transparent: true, opacity: 0.26, depthWrite: false }));
    waterB.rotation.x = -Math.PI / 2; waterB.position.set(-10, 0.05, 5); scene.add(waterB);
    // 云影：大片淡墨影子掠过水面（光影呼吸感）
    var cshadows = [];
    [[-52, -16, 40, 24, 1.0], [-8, 18, 46, 26, 1.35], [26, -34, 38, 22, 0.8], [58, 8, 42, 24, 1.1]].forEach(function (s) {
      var cs = new THREE.Mesh(new THREE.PlaneGeometry(s[2], s[3]), new THREE.MeshBasicMaterial({ map: toTex(blobTex()), transparent: true, opacity: 0.075, color: 0x57503e, depthWrite: false }));
      cs.rotation.x = -Math.PI / 2;
      cs.position.set(s[0], 0.04, s[1]);
      cs.userData.v = s[4];
      scene.add(cs); cshadows.push(cs);
    });

    // 云海：低层铺谷 + 高层薄纱（真云素材）
    var mists = [];
    for (var mi = 0; mi < 46; mi++) {
      var low = mi < 32;
      var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTex, transparent: true, opacity: low ? 0.2 + Math.random() * 0.18 : 0.07 + Math.random() * 0.08, depthWrite: false }));
      var sx = low ? 11 + Math.random() * 17 : 16 + Math.random() * 22;
      sp.scale.set(sx, sx * 0.34, 1);
      sp.position.set(-80 + Math.random() * 160, low ? 0.4 + Math.random() * 3.2 : 6 + Math.random() * 9, -70 + Math.random() * 140);
      sp.userData.v = 0.35 + Math.random() * 0.8;
      scene.add(sp); mists.push(sp);
    }

    /* ---------- 八组相机镜头坐标 ---------- */
    var VIEWS = {
      jinling:   { pos: [-25, 4.2, 6],   tgt: [-26, 5.5, -24] },
      zhongshan: { pos: [-4, 4.8, -25],  tgt: [-8, 6, -38] },
      hongzhou:  { pos: [-39, 3.6, 8],   tgt: [-46, 4, 20] },
      caishi:    { pos: [25, 3.8, 3],    tgt: [20, 4.5, -9] },
      jiangzhou: { pos: [35.5, 2.4, 8.5], tgt: [34, 2, 1] },
      bianjing:  { pos: [-51, 3.2, -37], tgt: [-58, 3.2, -46] },
      beimang:   { pos: [43, 3.4, 29],   tgt: [50, 3, 40] },
      overview:  { pos: [2, 44, 84],     tgt: [-2, 2, -6] }
    };

    /* ---------- 自制轨道控制 + 镜头飞行 ---------- */
    // 轨道状态：目标点 + 半径/方位角/仰角（d* 为缓动目标值）
    var ctl = { tgt: new THREE.Vector3(), r: 60, theta: 0, phi: 0.9, dTgt: new THREE.Vector3(), dR: 60, dTheta: 0, dPhi: 0.9 };
    var fly = null;
    function applyCamera() {
      var sph = new THREE.Spherical(ctl.r, THREE.MathUtils.clamp(ctl.phi, 0.12, 1.42), ctl.theta);
      var off = new THREE.Vector3().setFromSpherical(sph);
      camera.position.copy(ctl.tgt).add(off);
      camera.lookAt(ctl.tgt);
    }
    function setFromView(v) {
      ctl.dTgt.set(v.tgt[0], v.tgt[1], v.tgt[2]);
      var off = new THREE.Vector3(v.pos[0] - v.tgt[0], v.pos[1] - v.tgt[1], v.pos[2] - v.tgt[2]);
      var sph = new THREE.Spherical().setFromVector3(off);
      ctl.dR = sph.radius; ctl.dTheta = sph.theta; ctl.dPhi = sph.phi;
      ctl.tgt.copy(ctl.dTgt); ctl.r = ctl.dR; ctl.theta = ctl.dTheta; ctl.phi = ctl.dPhi;
      applyCamera();
    }
    setFromView(VIEWS.overview);
    // 镜头飞行：记录起终点，交由渲染循环插值
    function flyTo(key, dur) {
      var v = VIEWS[key]; if (!v) return;
      var tgt1 = new THREE.Vector3(v.tgt[0], v.tgt[1], v.tgt[2]);
      var p1 = tgt1.clone().add(new THREE.Vector3(v.pos[0] - v.tgt[0], v.pos[1] - v.tgt[1], v.pos[2] - v.tgt[2]));
      fly = { p0: camera.position.clone(), p1: p1, t0: ctl.tgt.clone(), t1: tgt1, start: performance.now(), dur: reduced ? 0 : (dur || 2100) };
    }
    function ease(k) { return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }
    var dragging = 0, lastX = 0, lastY = 0, hinted = false;
    var dom = renderer.domElement;
    dom.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    // 拖拽：左键旋转，右键/Shift 平移
    dom.addEventListener("pointerdown", function (e) {
      if (fly) return;
      dragging = e.button === 2 || e.shiftKey ? 2 : 1;
      lastX = e.clientX; lastY = e.clientY;
      dom.setPointerCapture(e.pointerId);
      hideHint();
    });
    dom.addEventListener("pointermove", function (e) {
      if (!dragging || fly) return;
      var dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
      if (dragging === 1) {
        ctl.dTheta -= dx * 0.005;
        ctl.dPhi = THREE.MathUtils.clamp(ctl.dPhi - dy * 0.004, 0.12, 1.42);
      } else {
        var panScale = ctl.r * 0.0012;
        var right = new THREE.Vector3().setFromSphericalCoords(1, Math.PI / 2, ctl.dTheta + Math.PI / 2);
        ctl.dTgt.addScaledVector(right, -dx * panScale);
        ctl.dTgt.y = 0;
        var fwd = new THREE.Vector3().subVectors(ctl.dTgt, camera.position).setY(0).normalize();
        ctl.dTgt.addScaledVector(fwd, dy * panScale);
        ctl.dTgt.x = THREE.MathUtils.clamp(ctl.dTgt.x, -90, 90);
        ctl.dTgt.z = THREE.MathUtils.clamp(ctl.dTgt.z, -90, 90);
      }
    });
    function endDrag() { dragging = 0; }
    dom.addEventListener("pointerup", endDrag);
    dom.addEventListener("pointercancel", endDrag);
    dom.addEventListener("wheel", function (e) {
      e.preventDefault(); if (fly) return;
      ctl.dR = THREE.MathUtils.clamp(ctl.dR * (1 + e.deltaY * 0.001), 5, 130);
      hideHint();
    }, { passive: false });

    /* ---------- 点位与笺卡 ---------- */
    var SPOTS = {
      jinling: { name: "金陵", tag: "南唐都城", now: "今 · 江苏南京",
        events: [["937", "七夕生于金陵宫苑，丰额骈齿、一目重瞳，宫中视为奇相"], ["961", "中主李璟病逝，二十五岁的李煜在金陵柩前即位"], ["975", "宋军围城日久，城破辞庙北上，「最是仓皇辞庙日」"]],
        word: "《破阵子》 四十年来家国，三千里地山河。" },
      zhongshan: { name: "钟山", tag: "少年隐读", now: "金陵城北 · 今紫金山",
        events: [["约955—959", "长兄弘冀性猜忌，李煜自号「钟隐」，志在山水，隐读经籍以避锋芒"]],
        word: "《渔父》 一壶酒，一竿身，快活如侬有几人。" },
      hongzhou: { name: "洪州", tag: "南唐南都", now: "今 · 江西南昌",
        events: [["961", "中主迁都洪州未几病逝；李煜自金陵入继大统，而国势已如累卵"]],
        word: "《浣溪沙》 欲寻陈迹怅人非，天教心愿与身违。" },
      caishi: { name: "采石矶", tag: "江防要冲", now: "今 · 安徽马鞍山",
        events: [["974", "宋人于采石矶江面架设浮桥，宋军由此渡江，金陵遂成孤城"], ["975", "围城经年，城中愁思日深，终至城破"]],
        word: "《乌夜啼》 世事漫随流水，算来一梦浮生。" },
      jiangzhou: { name: "江舟", tag: "辞庙北上", now: "长江 · 975 年冬",
        events: [["975", "城破，登舟北上。教坊乐工送别，「最是仓皇辞庙日，垂泪对宫娥」"]],
        word: "《浪淘沙令》 梦里不知身是客，一晌贪欢。" },
      bianjing: { name: "汴京", tag: "违命侯岁月", now: "今 · 河南开封",
        events: [["975", "被押北上，受封「违命侯」，自言「此中日夕，只以眼泪洗面」"], ["978", "七夕四十二岁生日，作《虞美人》，是夜被赐牵机药，词成而人逝"]],
        word: "《虞美人》 问君能有几多愁？恰似一江春水向东流。" },
      beimang: { name: "北邙山", tag: "词心不朽", now: "洛阳之北 · 长眠之所",
        events: [["978", "葬于北邙山，江南旧臣设奠相送。词人已逝，词心自此不朽"]],
        word: "《浪淘沙令》 流水落花春去也，天上人间。" },
      overview: { name: "全景", tag: "三千里地山河", now: "南唐疆域 · 写意",
        events: [["937—978", "四十一年，从金陵宫苑到北邙孤冢。一卷水墨，走完一生"]],
        word: "《破阵子》 四十年来家国，三千里地山河。" }
    };
    var popup = document.getElementById("inkPopup");
    var popupDefault = popup.querySelector("[data-popup-default]");
    var popupDetail = popup.querySelector("[data-popup-detail]");
    var dotBtns = Array.prototype.slice.call(document.querySelectorAll(".dot-btn"));
    // 填充并弹出站点笺卡
    function showSpot(key) {
      var spot = SPOTS[key]; if (!spot) return;
      popupDefault.hidden = true; popupDetail.hidden = false; popup.hidden = false;
      popupDetail.querySelector("[data-spot-era]").textContent = spot.tag;
      popupDetail.querySelector("[data-spot-name]").textContent = spot.name;
      popupDetail.querySelector("[data-spot-now]").textContent = spot.now;
      var list = popupDetail.querySelector("[data-spot-events]");
      list.innerHTML = "";
      spot.events.forEach(function (ev) {
        var li = document.createElement("li");
        var b = document.createElement("b"); b.textContent = ev[0];
        li.appendChild(b); li.appendChild(document.createTextNode(ev[1]));
        list.appendChild(li);
      });
      popupDetail.querySelector("[data-spot-word]").textContent = spot.word;
    }
    // 点位点击：点亮圆点 + 镜头飞行 + 弹笺
    function go(key) {
      dotBtns.forEach(function (d) { d.classList.toggle("is-active", d.dataset.go === key); });
      flyTo(key);
      showSpot(key);
    }
    dotBtns.forEach(function (d) { d.addEventListener("click", function () { go(d.dataset.go); }); });
    // 收起笺卡与 Esc 关闭
    popup.querySelector(".popup-close").addEventListener("click", function () {
      popup.hidden = true;
      popupDefault.hidden = false; popupDetail.hidden = true;
      dotBtns.forEach(function (d) { d.classList.remove("is-active"); });
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !popup.hidden) {
        popup.hidden = true; popupDefault.hidden = false; popupDetail.hidden = true;
      }
    });
    var hint = document.getElementById("stageHint");
    function hideHint() { if (!hinted && hint) { hinted = true; hint.classList.add("is-hidden"); } }

    /* ---------- 渲染循环 ---------- */
    // 渲染循环：飞行插值 / 轨道缓动 / 水纹云影漂移 / 孤舟摇曳
    var clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      var dt = Math.min(clock.getDelta(), 0.05);
      var t = clock.elapsedTime;
      try {
      if (fly) {
        var k = fly.dur ? Math.min((performance.now() - fly.start) / fly.dur, 1) : 1;
        var ek = ease(k);
        camera.position.lerpVectors(fly.p0, fly.p1, ek);
        ctl.tgt.lerpVectors(fly.t0, fly.t1, ek);
        camera.lookAt(ctl.tgt);
        if (k >= 1) {
          var off = new THREE.Vector3().subVectors(camera.position, ctl.tgt);
          var sph = new THREE.Spherical().setFromVector3(off);
          ctl.r = sph.radius; ctl.theta = sph.theta; ctl.phi = sph.phi;
          ctl.dR = ctl.r; ctl.dTheta = ctl.theta; ctl.dPhi = ctl.phi; ctl.dTgt.copy(ctl.tgt);
          fly = null;
        }
      } else {
        ctl.tgt.lerp(ctl.dTgt, 0.1);
        ctl.r += (ctl.dR - ctl.r) * 0.1;
        ctl.theta += (ctl.dTheta - ctl.theta) * 0.12;
        ctl.phi += (ctl.dPhi - ctl.phi) * 0.12;
        applyCamera();
      }
      if (!reduced) {
        waterTexA.offset.x += dt * 0.02;
        waterTexB.offset.x -= dt * 0.012;
        seaTex.offset.x += dt * 0.006;
        seaTex.offset.y += dt * 0.003;
        mists.forEach(function (sp) {
          sp.position.x += sp.userData.v * dt;
          if (sp.position.x > 82) sp.position.x = -82;
        });
        cshadows.forEach(function (cs) {
          cs.position.x += cs.userData.v * dt;
          if (cs.position.x > 95) cs.position.x = -95;
        });
        if (boat.userData.baseY !== undefined) boat.position.y = boat.userData.baseY + Math.sin(t * 1.4) * 0.06;
      }
      renderer.render(scene, camera);
      } catch (err) {
        // 渲染循环绝不允许死掉：异常拦截 + 释放 fly（fly 卡死会永久锁死拖拽）
        if (!window.__mapErr) { window.__mapErr = err; console.error("[水墨行迹] 渲染循环异常（已拦截并继续）:", err); }
        fly = null;
      }
    }
    resize();
    animate();
    dotBtns[7].classList.add("is-active");
  })();
  </script>
</body></html>
